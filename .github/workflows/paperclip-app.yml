# Build Paperclip Android APK
# Android project files are checked into this repo (android-skeleton/).
# Each run: fetch paperclip-master → build UI → copy assets → Gradle build APK
name: Build Paperclip APK

on:
  workflow_dispatch:
    inputs:
      paperclip_ref:
        description: "paperclip-master branch/ref"
        required: false
        default: master
      build_type:
        description: "debug or release"
        required: false
        default: release
  push:
    branches: [main]
    paths: [".github/workflows/paperclip-app.yml"]

permissions: { contents: read }
concurrency:
  group: paperclip-apk-${{ inputs.paperclip_ref || 'main' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - uses: actions/checkout@v4
        with:
          repository: jjjjllll111/paperclip-master
          ref: ${{ inputs.paperclip_ref || 'master' }}
          token: ${{ secrets.GH_PAT }}
          path: _paperclip
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - run: corepack enable || true

      - uses: pnpm/action-setup@v4
        with: { version: 9, run_install: false }

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }

      - uses: android-actions/setup-android@v3

      - run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      # ── Build UI ──────────────────────────────────────────────
      - name: Build Paperclip UI
        working-directory: _paperclip
        run: |
          pnpm install --no-frozen-lockfile
          cd ui && pnpm build
          find dist -name "*.map" -delete 2>/dev/null || true
          find dist -name "*.LICENSE" -delete 2>/dev/null || true
          echo "UI: $(du -sh dist | cut -f1) files=$(find dist -type f | wc -l)"

      # ── Assemble Android project ──────────────────────────────
      - name: Assemble Android project
        run: |
          set -euo pipefail
          SRC=android-skeleton
          DST=_paperclip/ui/android
          rm -rf "$DST"
          cp -a "$SRC" "$DST"
          mkdir -p "$DST/app/src/main/assets"
          cp -a _paperclip/ui/dist/. "$DST/app/src/main/assets/"
          echo "Assets: $(du -sh "$DST/app/src/main/assets" | cut -f1) files=$(find "$DST/app/src/main/assets" -type f | wc -l)"

      # ── Build APK ─────────────────────────────────────────────
      - name: Build APK
        working-directory: _paperclip/ui/android
        run: |
          set -euo pipefail
          GRADLE_BIN=$(which gradle 2>/dev/null || echo "")
          if [ ! -x "$GRADLE_BIN" ]; then
            echo "Downloading Gradle 8.6..."
            curl -fsSL "https://services.gradle.org/distributions/gradle-8.6-bin.zip" -o /tmp/g.zip
            cd /tmp && unzip -q g.zip && cd -
            GRADLE_BIN=/tmp/gradle-8.6/bin/gradle
          fi
          echo "Gradle: $GRADLE_BIN"
          "$GRADLE_BIN" --version | head -3
          if [ "${{ inputs.build_type }}" = "debug" ]; then
            "$GRADLE_BIN" :app:assembleDebug --stacktrace --no-daemon
          else
            "$GRADLE_BIN" :app:assembleRelease --stacktrace --no-daemon
            KEYSTORE="$RUNNER_TEMP/paperclip.keystore"
            keytool -genkeypair -v -keystore "$KEYSTORE" -alias paperclip -keyalg RSA -keysize 2048 -validity 10000 -storepass paperclip -keypass paperclip -dname "CN=Paperclip,OU=CI,O=Paperclip,L=Local,ST=Local,C=CN"
            UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
            SIGNED="app/build/outputs/apk/release/app-release-signed.apk"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$KEYSTORE" --ks-pass pass:paperclip --key-pass pass:paperclip --out "$SIGNED" "$UNSIGNED"
            cp "$SIGNED" "app/build/outputs/apk/release/app-release.apk"
          fi
          echo "=== APK ==="
          find app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;

      # ── Verify ────────────────────────────────────────────────
      - name: Verify APK
        run: |
          APK=$(find _paperclip/ui/android/app/build/outputs/apk -name "*.apk" -not -name "*unsigned*" | head -1)
          [ -z "$APK" ] && APK=$(find _paperclip/ui/android/app/build/outputs/apk -name "*.apk" | head -1)
          echo "APK: $APK"
          ls -lh "$APK"
          unzip -l "$APK" | grep -E "assets/index.html|classes|lib/" | head -20
          echo "DEX: $(unzip -l "$APK" | grep -c 'classes.*\.dex')"

      # ── E2E Emulator ──────────────────────────────────────────
      - name: Enable KVM
        run: |
          sudo groupadd -r kvm 2>/dev/null || true
          sudo gpasswd -a $USER kvm 2>/dev/null || true
          sudo chown $USER /dev/kvm 2>/dev/null || sudo chmod 666 /dev/kvm 2>/dev/null || true

      - name: E2E Emulator Test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            set -e
            APK=$(find _paperclip/ui/android/app/build/outputs/apk -name "*.apk" -not -name "*unsigned*" | head -1)
            [ -z "$APK" ] && APK=$(find _paperclip/ui/android/app/build/outputs/apk -name "*.apk" | head -1)
            echo "Installing: $APK"
            adb wait-for-device
            adb shell settings put global window_animation_scale 0 || true
            adb shell settings put global transition_animation_scale 0 || true
            adb shell settings put global animator_duration_scale 0 || true
            adb install -r "$APK"
            adb shell am start -n com.paperclip.app/.MainActivity
            for i in $(seq 1 20); do sleep 3; PID=$(adb shell pidof com.paperclip.app 2>/dev/null || echo ""); echo "PID=$PID tick=$i"; if [ -n "$PID" ]; then echo "Running!"; break; fi; done
            adb logcat -d -s PaperclipMain:I PaperclipKA:I AndroidRuntime:E 2>/dev/null | tail -30 || true

      # ── Upload + Release ──────────────────────────────────────
      - uses: actions/upload-artifact@v4
        with:
          name: Paperclip-${{ inputs.build_type || 'release' }}-apk
          path: _paperclip/ui/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create Release
        if: inputs.build_type == 'release' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: paperclip-apk-${{ github.run_number }}
          name: Paperclip APK #${{ github.run_number }}
          files: _paperclip/ui/android/app/build/outputs/apk/**/*.apk
          draft: false
          prerelease: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
