# Build Paperclip Android APK with SEA (Node.js ARM64 ELF)
# Caches: Termux node binary, shared libs, SEA blob — only rebuilds when upstream changes
name: Build Paperclip APK

on:
  workflow_dispatch:
    inputs:
      paperclip_app_ref:
        description: "paperclip-app branch/ref"
        required: false
        default: master
      paperclip_master_ref:
        description: "paperclip-master branch/ref"
        required: false
        default: master
      build_type:
        description: "debug or release"
        required: false
        default: release
      force_rebuild:
        description: "Force rebuild SEA (ignore cache)"
        required: false
        default: "false"
  push:
    branches: [main]
    paths: [".github/workflows/paperclip-app.yml"]

permissions: { contents: write }
concurrency:
  group: paperclip-apk-${{ inputs.paperclip_app_ref || 'main' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"
    steps:
      # ── Checkout ─────────────────────────────────────────────
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - name: Checkout paperclip-app
        uses: actions/checkout@v4
        with:
          repository: jjjjllll111/paperclip-app
          ref: ${{ inputs.paperclip_app_ref || 'master' }}
          token: ${{ secrets.GH_PAT }}
          path: _app
          fetch-depth: 1

      - name: Checkout paperclip-master
        uses: actions/checkout@v4
        with:
          repository: jjjjllll111/paperclip-master
          ref: ${{ inputs.paperclip_master_ref || 'master' }}
          token: ${{ secrets.GH_PAT }}
          path: _paperclip
          fetch-depth: 1

      # ── Setup latest tools ──────────────────────────────────
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - run: corepack enable || true

      - uses: pnpm/action-setup@v4
        with: { version: 9, run_install: false }

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "25" }

      - uses: android-actions/setup-android@v3

      - name: Install NDK + platforms
        run: |
          sdkmanager --install "ndk;29.0.14206865" "platforms;android-36" "build-tools;35.0.0" "platform-tools"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      # ── Cache: Termux node + shared libs ────────────────────
      - name: Cache SEA dependencies
        id: cache-sea
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/sea-host
            ${{ runner.temp }}/termux-libs
          key: sea-deps-v1-${{ hashFiles('.github/workflows/paperclip-app.yml') }}
          restore-keys: |
            sea-deps-v1-

      # ── Cache: SEA blob ─────────────────────────────────────
      - name: Cache SEA blob
        id: cache-blob
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/sea-prep.blob
          key: sea-blob-v1-${{ hashFiles('.github/workflows/paperclip-app.yml') }}
          restore-keys: |
            sea-blob-v1-

      # ── Build Paperclip UI ──────────────────────────────────
      - name: Build Paperclip UI
        working-directory: _paperclip
        run: |
          pnpm install --no-frozen-lockfile
          cd ui && pnpm build
          find dist -name "*.map" -delete 2>/dev/null || true
          find dist -name "*.LICENSE" -delete 2>/dev/null || true
          echo "UI: $(du -sh dist | cut -f1) files=$(find dist -type f | wc -l)"

      - name: Copy UI assets to Android
        run: |
          set -euo pipefail
          ASSETS=_app/android/app/src/main/assets/ui-dist
          rm -rf "$ASSETS"
          mkdir -p "$ASSETS"
          cp -a _paperclip/ui/dist/. "$ASSETS/"
          echo "Assets: $(du -sh "$ASSETS" | cut -f1) files=$(find "$ASSETS" -type f | wc -l)"

      # ── Extract Termux Node.js (cached) ─────────────────────
      - name: Extract Termux Node.js ARM64
        if: steps.cache-sea.outputs.cache-hit != 'true' || inputs.force_rebuild == 'true'
        run: |
          set -euo pipefail
          TMP="$RUNNER_TEMP/termux-node"
          rm -rf "$TMP"
          mkdir -p "$TMP/nex" "$TMP/libs"

          PKGINDEX="$TMP/Packages"
          curl -fsSL https://packages.termux.dev/apt/termux-main/dists/stable/main/binary-aarch64/Packages -o "$PKGINDEX"

          pkg_file() { awk -v RS= -v FS='\n' -v pat="^Package: $1\$" '$1 ~ pat { for (i=1;i<=NF;i++) if ($i ~ /^Filename:/) { sub(/^Filename: /,"",$i); print $i; exit } }' "$PKGINDEX"; }
          expand_deb() { local deb="$1" dest="$2"; local tmp; tmp=$(mktemp -d); (cd "$tmp" && ar x "$deb" && tar -xf data.tar.* -C "$dest"); rm -rf "$tmp"; }

          NF=$(pkg_file nodejs)
          [ -z "$NF" ] && { echo "FATAL: nodejs not in Packages"; exit 1; }
          curl -fsSL "https://packages.termux.dev/apt/termux-main/$NF" -o "$TMP/node.deb"
          (cd "$TMP" && mkdir -p nex && cd nex && ar x "$TMP/node.deb" && tar -xf data.tar.*)

          NODE_BIN="$TMP/nex/data/data/com.termux/files/usr/bin/node"
          test -x "$NODE_BIN" || { echo "FATAL: node missing"; exit 1; }

          mkdir -p "$RUNNER_TEMP/sea-host"
          cp "$NODE_BIN" "$RUNNER_TEMP/sea-host/node-bionic"
          chmod +x "$RUNNER_TEMP/sea-host/node-bionic"
          file "$RUNNER_TEMP/sea-host/node-bionic"

          DEPS="zlib c-ares libsqlite libffi openssl libicu libc++ libandroid-shmem libandroid-spawn"
          AGG="$RUNNER_TEMP/termux-libs"
          mkdir -p "$AGG"
          for pkg in $DEPS; do
            F=$(pkg_file "$pkg" || true)
            [ -z "$F" ] && continue
            curl -fsSL "https://packages.termux.dev/apt/termux-main/$F" -o "$TMP/$pkg.deb" || continue
            mkdir -p "$TMP/libs/$pkg"
            expand_deb "$TMP/$pkg.deb" "$TMP/libs/$pkg"
          done
          find "$TMP/libs" -type f -name "*.so*" -not -path "*/_agg/*" | while read -r f; do cp -n "$f" "$AGG"/ 2>/dev/null || cp "$f" "$AGG"/; done
          find "$TMP/nex" -type f -name "*.so*" | while read -r f; do cp -n "$f" "$AGG"/ 2>/dev/null || true; done
          if [ ! -f "$AGG/libc++_shared.so" ]; then
            for f in "$AGG"/libc*.so* "$AGG"/*c++*.so*; do
              [ -f "$f" ] || continue
              if file "$f" 2>&1 | grep -qi "shared object"; then cp -a "$f" "$AGG/libc++_shared.so"; break; fi
            done
          fi
          rm -f "$AGG"/libz.so* "$AGG"/libc.so* "$AGG"/libm.so* "$AGG"/libdl.so* || true
          echo "SEA deps cached: node=$(ls -lh "$RUNNER_TEMP/sea-host/node-bionic" | awk '{print $5}') libs=$(ls "$AGG" | wc -l)"

      # ── Build SEA binary (cached) ───────────────────────────
      - name: Build SEA binary
        if: steps.cache-blob.outputs.cache-hit != 'true' || inputs.force_rebuild == 'true'
        run: |
          set -euo pipefail

          cat > "$RUNNER_TEMP/sea-entry.js" << 'SEA_EOF'
          const fs = require("fs");
          const path = require("path");
          const serverPath = path.join(__dirname, "server.js");
          if (fs.existsSync(serverPath)) { require(serverPath); }
          else { console.error("server.js not found"); process.exit(1); }
          SEA_EOF

          cat > "$RUNNER_TEMP/server.js" << 'SVR_EOF'
          const http = require("http");
          const fs = require("fs");
          const path = require("path");
          const PORT = parseInt(process.env.PORT || "3100", 10);
          const ASSETS_DIR = path.join(__dirname, "ui-dist");
          const MIME = {".html":"text/html; charset=utf-8",".js":"application/javascript; charset=utf-8",".css":"text/css; charset=utf-8",".json":"application/json; charset=utf-8",".png":"image/png",".svg":"image/svg+xml",".ico":"image/x-icon"};
          const API = {"/api/health":()=>({status:"ok",timestamp:Date.now()}),"/api/status":()=>({ok:true,port:PORT,mode:"standalone"})};
          http.createServer((req,res)=>{
            const url=new URL(req.url,`http://localhost:${PORT}`);
            res.setHeader("Access-Control-Allow-Origin","*");
            if(req.method==="OPTIONS"){res.writeHead(204);return res.end();}
            if(API[url.pathname]){res.writeHead(200,{"Content-Type":"application/json"});return res.end(JSON.stringify(API[url.pathname]()));}
            let fp=path.join(ASSETS_DIR,url.pathname==="/"?"index.html":url.pathname);
            if(!fs.existsSync(fp)||fs.statSync(fp).isDirectory())fp=path.join(ASSETS_DIR,"index.html");
            if(!fs.existsSync(fp)){res.writeHead(404);return res.end("Not Found");}
            try{const c=require("fs").readFileSync(fp);res.writeHead(200,{"Content-Type":MIME[path.extname(fp).toLowerCase()]||"application/octet-stream"});res.end(c);}
            catch(e){res.writeHead(500);res.end("Error");}
          }).listen(PORT,"0.0.0.0",()=>console.log(`Paperclip on http://0.0.0.0:${PORT}`));
          SVR_EOF

          cat > "$RUNNER_TEMP/sea-config.json" << SEA_JSON
          {"main":"$RUNNER_TEMP/sea-entry.js","output":"$RUNNER_TEMP/sea-prep.blob","disableExperimentalSEAWarning":true,"useSnapshot":false,"useCodeCache":false}
          SEA_JSON

          node --experimental-sea-config "$RUNNER_TEMP/sea-config.json"
          ls -lh "$RUNNER_TEMP/sea-prep.blob"

          cp "$RUNNER_TEMP/sea-host/node-bionic" "$RUNNER_TEMP/myapp"
          chmod +x "$RUNNER_TEMP/myapp"
          npm install --no-save postject 2>&1 | tail -3
          npx postject "$RUNNER_TEMP/myapp" NODE_SEA_BLOB "$RUNNER_TEMP/sea-prep.blob" \
            --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2

          file "$RUNNER_TEMP/myapp"
          ls -lh "$RUNNER_TEMP/myapp"

      # ── Stage SEA assets ────────────────────────────────────
      - name: Stage SEA assets for APK
        run: |
          set -euo pipefail
          DEST=_app/android/app/src/main/assets
          rm -rf "$DEST/myapp-dir" "$DEST/node-libs"
          mkdir -p "$DEST/myapp-dir" "$DEST/node-libs"

          cp "$RUNNER_TEMP/myapp" "$DEST/myapp-dir/myapp"
          chmod +x "$DEST/myapp-dir/myapp"
          cp "$RUNNER_TEMP/server.js" "$DEST/myapp-dir/"
          cp -a _paperclip/ui/dist "$DEST/myapp-dir/ui-dist"
          cp -a "$RUNNER_TEMP/termux-libs"/* "$DEST/node-libs/" 2>/dev/null || true

          echo "myapp: $(du -sh "$DEST/myapp-dir/myapp" | cut -f1)"
          echo "node-libs: $(ls "$DEST/node-libs" | wc -l) files $(du -sh "$DEST/node-libs" | cut -f1)"
          echo "ui-dist: $(du -sh "$DEST/myapp-dir/ui-dist" | cut -f1)"

      - name: Strip native libs
        run: |
          set -euo pipefail
          STRIP="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          for f in _app/android/app/src/main/assets/node-libs/*.so*; do
            [ -f "$f" ] || continue
            "$STRIP" --strip-all --strip-unneeded "$f" 2>/dev/null || true
          done
          echo "Stripped: $(du -sh _app/android/app/src/main/assets/node-libs | cut -f1)"

      # ── Build APK ──────────────────────────────────────────
      - name: Build APK
        working-directory: _app/android
        run: |
          set -euo pipefail
          chmod +x gradlew 2>/dev/null || true
          if ! ./gradlew --version 2>/dev/null; then
            curl -fsSL -o /tmp/gradle.zip "https://services.gradle.org/distributions/gradle-9.7.1-bin.zip"
            cd /tmp && unzip -qo gradle.zip && export PATH=/tmp/gradle-9.7.1/bin:$PATH
          fi
          gradle --version | head -3
          if [ "${{ inputs.build_type }}" = "debug" ]; then
            gradle :app:assembleDebug --stacktrace --no-daemon
          else
            gradle :app:assembleRelease --stacktrace --no-daemon
            KEYSTORE="$RUNNER_TEMP/paperclip.keystore"
            keytool -genkeypair -v -keystore "$KEYSTORE" -alias paperclip -keyalg RSA -keysize 2048 -validity 10000 -storepass paperclip -keypass paperclip -dname "CN=Paperclip,OU=CI,O=Paperclip,L=Local,ST=Local,C=CN"
            UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
            SIGNED="app/build/outputs/apk/release/app-release-signed.apk"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$KEYSTORE" --ks-pass pass:paperclip --key-pass pass:paperclip --out "$SIGNED" "$UNSIGNED"
            cp "$SIGNED" "app/build/outputs/apk/release/app-release.apk"
          fi
          echo "=== APK ==="
          find app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;

      - name: Verify APK
        run: |
          APK=$(find _app/android/app/build/outputs/apk -name "*.apk" -not -name "*unsigned*" | head -1)
          [ -z "$APK" ] && APK=$(find _app/android/app/build/outputs/apk -name "*.apk" | head -1)
          echo "APK: $APK"
          ls -lh "$APK"
          echo "=== Contents ==="
          unzip -l "$APK" | grep -E "myapp|node-libs|ui-dist|assets/index" | head -20
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      # ── Upload + Release ────────────────────────────────────
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Paperclip-${{ inputs.build_type || 'release' }}-apk-SEA
          path: _app/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create Release
        if: inputs.build_type == 'release' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: paperclip-apk-${{ github.run_number }}
          name: Paperclip APK SEA #${{ github.run_number }}
          files: _app/android/app/build/outputs/apk/**/*.apk
          draft: false
          prerelease: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
