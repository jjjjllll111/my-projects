# Build Paperclip Android APK with SEA (Node.js ARM64 ELF)
name: Build Paperclip APK

on:
  workflow_dispatch:
    inputs:
      paperclip_app_ref:
        description: "paperclip-app branch/ref"
        required: false
        default: master
      paperclip_master_ref:
        description: "paperclip-master branch/ref"
        required: false
        default: master
      build_type:
        description: "debug or release"
        required: false
        default: release
  push:
    branches: [main]
    paths: [".github/workflows/paperclip-app.yml"]

permissions: { contents: read }
concurrency:
  group: paperclip-apk-${{ inputs.paperclip_app_ref || 'main' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"
    steps:
      # ── Checkout ─────────────────────────────────────────────
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - name: Checkout paperclip-app
        uses: actions/checkout@v4
        with:
          repository: jjjjllll111/paperclip-app
          ref: ${{ inputs.paperclip_app_ref || 'master' }}
          token: ${{ secrets.GH_PAT }}
          path: _app
          fetch-depth: 1

      - name: Checkout paperclip-master
        uses: actions/checkout@v4
        with:
          repository: jjjjllll111/paperclip-master
          ref: ${{ inputs.paperclip_master_ref || 'master' }}
          token: ${{ secrets.GH_PAT }}
          path: _paperclip
          fetch-depth: 1

      # ── Setup tools ─────────────────────────────────────────
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - run: corepack enable || true

      - uses: pnpm/action-setup@v4
        with: { version: 9, run_install: false }

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }

      - uses: android-actions/setup-android@v3

      - name: Install NDK + platforms
        run: |
          sdkmanager --install "ndk;27.2.12479018" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      # ── Build Paperclip UI ──────────────────────────────────
      - name: Build Paperclip UI
        working-directory: _paperclip
        run: |
          pnpm install --no-frozen-lockfile
          cd ui && pnpm build
          find dist -name "*.map" -delete 2>/dev/null || true
          find dist -name "*.LICENSE" -delete 2>/dev/null || true
          echo "UI: $(du -sh dist | cut -f1) files=$(find dist -type f | wc -l)"

      # ── Copy UI assets ──────────────────────────────────────
      - name: Copy UI assets to Android
        run: |
          set -euo pipefail
          ASSETS=_app/android/app/src/main/assets/ui-dist
          rm -rf "$ASSETS"
          mkdir -p "$ASSETS"
          cp -a _paperclip/ui/dist/. "$ASSETS/"
          echo "Assets: $(du -sh "$ASSETS" | cut -f1) files=$(find "$ASSETS" -type f | wc -l)"

      # ── Extract Termux Node.js (ARM64 Bionic ELF) ───────────
      - name: Extract Termux Node.js ARM64
        run: |
          set -euo pipefail
          TMP="$RUNNER_TEMP/termux-node"
          rm -rf "$TMP"
          mkdir -p "$TMP/nex" "$TMP/libs"

          # Download Termux Packages index
          PKGINDEX="$TMP/Packages"
          curl -fsSL https://packages.termux.dev/apt/termux-main/dists/stable/main/binary-aarch64/Packages -o "$PKGINDEX"

          # Helper to find package file
          pkg_file() { awk -v RS= -v FS='\n' -v pat="^Package: $1\$" '$1 ~ pat { for (i=1;i<=NF;i++) if ($i ~ /^Filename:/) { sub(/^Filename: /,"",$i); print $i; exit } }' "$PKGINDEX"; }

          # Helper to extract deb
          expand_deb() { local deb="$1" dest="$2"; local tmp; tmp=$(mktemp -d); (cd "$tmp" && ar x "$deb" && tar -xf data.tar.* -C "$dest"); rm -rf "$tmp"; }

          # Download Node.js
          NF=$(pkg_file nodejs)
          [ -z "$NF" ] && { echo "FATAL: nodejs not in Packages"; exit 1; }
          curl -fsSL "https://packages.termux.dev/apt/termux-main/$NF" -o "$TMP/node.deb"
          mkdir -p "$TMP/nex"
          (cd "$TMP/nex" && ar x "$TMP/node.deb" && tar -xf data.tar.*)

          NODE_BIN="$TMP/nex/data/data/com.termux/files/usr/bin/node"
          test -x "$NODE_BIN" || { echo "FATAL: node missing"; exit 1; }

          # Save for SEA
          mkdir -p "$RUNNER_TEMP/sea-host"
          cp "$NODE_BIN" "$RUNNER_TEMP/sea-host/node-bionic"
          chmod +x "$RUNNER_TEMP/sea-host/node-bionic"
          file "$RUNNER_TEMP/sea-host/node-bionic"

          # Download shared libs
          DEPS="zlib c-ares libsqlite libffi openssl libicu libc++ libandroid-shmem libandroid-spawn"
          for pkg in $DEPS; do
            F=$(pkg_file "$pkg" || true)
            [ -z "$F" ] && { echo "::warning::pkg $pkg not found"; continue; }
            echo "fetch $pkg -> $F"
            curl -fsSL "https://packages.termux.dev/apt/termux-main/$F" -o "$TMP/$pkg.deb" || continue
            mkdir -p "$TMP/libs/$pkg"
            expand_deb "$TMP/$pkg.deb" "$TMP/libs/$pkg"
          done

          # Aggregate shared libs
          AGG="$TMP/libs/_agg"
          mkdir -p "$AGG"
          find "$TMP/libs" -type f -name "*.so*" -not -path "*/_agg/*" | while read -r f; do
            cp -n "$f" "$AGG"/ 2>/dev/null || cp "$f" "$AGG"/
          done
          find "$TMP/nex" -type f -name "*.so*" | while read -r f; do
            cp -n "$f" "$AGG"/ 2>/dev/null || true
          done

          # Handle libc++_shared.so
          if [ ! -f "$AGG/libc++_shared.so" ]; then
            for f in "$AGG"/libc*.so* "$AGG"/ *c++*.so*; do
              [ -f "$f" ] || continue
              if file "$f" 2>&1 | grep -qi "shared object"; then
                cp -a "$f" "$AGG/libc++_shared.so"
                break
              fi
            done
          fi

          # Remove conflicting system libs
          rm -f "$AGG"/libz.so* "$AGG"/libc.so* "$AGG"/libm.so* "$AGG"/libdl.so* || true

          mkdir -p _app/android/app/src/main/assets/node-libs
          cp -a "$AGG"/* _app/android/app/src/main/assets/node-libs/ 2>/dev/null || true
          echo "node-libs: $(ls _app/android/app/src/main/assets/node-libs | wc -l) files"

      # ── Build SEA binary ────────────────────────────────────
      - name: Build SEA binary
        run: |
          set -euo pipefail

          # Create SEA entry point (CJS)
          cat > "$RUNNER_TEMP/sea-entry.js" << 'SEA_EOF'
          const fs = require("fs");
          const path = require("path");

          // Load Paperclip server
          const serverPath = path.join(__dirname, "server.js");
          if (fs.existsSync(serverPath)) {
            require(serverPath);
          } else {
            console.error("Paperclip server not found at", serverPath);
            process.exit(1);
          }
          SEA_EOF

          # Create simple Paperclip server
          cat > "$RUNNER_TEMP/server.js" << 'SVR_EOF'
          const http = require("http");
          const fs = require("fs");
          const path = require("path");

          const PORT = parseInt(process.env.PORT || "3100", 10);
          const ASSETS_DIR = path.join(__dirname, "ui-dist");

          const MIME = {
            ".html": "text/html; charset=utf-8",
            ".js": "application/javascript; charset=utf-8",
            ".css": "text/css; charset=utf-8",
            ".json": "application/json; charset=utf-8",
            ".png": "image/png",
            ".svg": "image/svg+xml",
            ".ico": "image/x-icon",
          };

          const API = {
            "/api/health": () => ({ status: "ok", timestamp: Date.now() }),
            "/api/status": () => ({ ok: true, port: PORT, mode: "standalone" }),
          };

          const server = http.createServer((req, res) => {
            const url = new URL(req.url, `http://localhost:${PORT}`);
            res.setHeader("Access-Control-Allow-Origin", "*");
            if (req.method === "OPTIONS") { res.writeHead(204); return res.end(); }
            if (API[url.pathname]) {
              res.writeHead(200, { "Content-Type": "application/json" });
              return res.end(JSON.stringify(API[url.pathname]()));
            }
            let fp = path.join(ASSETS_DIR, url.pathname === "/" ? "index.html" : url.pathname);
            if (!fs.existsSync(fp) || fs.statSync(fp).isDirectory()) fp = path.join(ASSETS_DIR, "index.html");
            if (!fs.existsSync(fp)) { res.writeHead(404); return res.end("Not Found"); }
            const ext = path.extname(fp).toLowerCase();
            try {
              const content = fs.readFileSync(fp);
              res.writeHead(200, { "Content-Type": MIME[ext] || "application/octet-stream" });
              res.end(content);
            } catch (e) { res.writeHead(500); res.end("Error"); }
          });

          server.listen(PORT, "0.0.0.0", () => {
            console.log(`Paperclip server on http://0.0.0.0:${PORT}`);
          });
          SVR_EOF

          # Create SEA config
          cat > "$RUNNER_TEMP/sea-config.json" << SEA_JSON
          {
            "main": "$RUNNER_TEMP/sea-entry.js",
            "output": "$RUNNER_TEMP/sea-prep.blob",
            "disableExperimentalSEAWarning": true,
            "useSnapshot": false,
            "useCodeCache": false
          }
          SEA_JSON

          # Generate blob
          node --experimental-sea-config "$RUNNER_TEMP/sea-config.json"
          ls -lh "$RUNNER_TEMP/sea-prep.blob"

          # Inject into Bionic ELF
          cp "$RUNNER_TEMP/sea-host/node-bionic" "$RUNNER_TEMP/myapp"
          chmod +x "$RUNNER_TEMP/myapp"
          npm install --no-save postject 2>&1 | tail -5
          npx postject "$RUNNER_TEMP/myapp" NODE_SEA_BLOB "$RUNNER_TEMP/sea-prep.blob" \
            --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2

          echo "SEA binary built:"
          file "$RUNNER_TEMP/myapp"
          ls -lh "$RUNNER_TEMP/myapp"

          # Stage for APK
          mkdir -p _app/android/app/src/main/assets/myapp-dir
          cp "$RUNNER_TEMP/myapp" _app/android/app/src/main/assets/myapp-dir/myapp
          chmod +x _app/android/app/src/main/assets/myapp-dir/myapp
          cp "$RUNNER_TEMP/server.js" _app/android/app/src/main/assets/myapp-dir/
          cp -a _paperclip/ui/dist _app/android/app/src/main/assets/myapp-dir/ui-dist

          echo "myapp staged: $(du -sh _app/android/app/src/main/assets/myapp-dir | cut -f1)"

      # ── Strip native libs ───────────────────────────────────
      - name: Strip native libs
        run: |
          set -euo pipefail
          STRIP="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          for f in _app/android/app/src/main/assets/node-libs/*.so*; do
            [ -f "$f" ] || continue
            "$STRIP" --strip-all --strip-unneeded "$f" 2>/dev/null || true
          done
          echo "Stripped node-libs: $(du -sh _app/android/app/src/main/assets/node-libs | cut -f1)"

      # ── Build APK ──────────────────────────────────────────
      - name: Build APK
        working-directory: _app/android
        run: |
          set -euo pipefail
          chmod +x gradlew 2>/dev/null || true
          if ! ./gradlew --version 2>/dev/null; then
            echo "Downloading Gradle 8.6..."
            curl -fsSL -o /tmp/gradle.zip "https://services.gradle.org/distributions/gradle-8.6-bin.zip"
            cd /tmp && unzip -qo gradle.zip
            export PATH=/tmp/gradle-8.6/bin:$PATH
          fi
          gradle --version | head -3
          if [ "${{ inputs.build_type }}" = "debug" ]; then
            gradle :app:assembleDebug --stacktrace --no-daemon
          else
            gradle :app:assembleRelease --stacktrace --no-daemon
            KEYSTORE="$RUNNER_TEMP/paperclip.keystore"
            keytool -genkeypair -v -keystore "$KEYSTORE" -alias paperclip -keyalg RSA -keysize 2048 -validity 10000 -storepass paperclip -keypass paperclip -dname "CN=Paperclip,OU=CI,O=Paperclip,L=Local,ST=Local,C=CN"
            UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
            SIGNED="app/build/outputs/apk/release/app-release-signed.apk"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$KEYSTORE" --ks-pass pass:paperclip --key-pass pass:paperclip --out "$SIGNED" "$UNSIGNED"
            cp "$SIGNED" "app/build/outputs/apk/release/app-release.apk"
          fi
          echo "=== APK ==="
          find app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;

      - name: Verify APK
        run: |
          APK=$(find _app/android/app/build/outputs/apk -name "*.apk" -not -name "*unsigned*" | head -1)
          [ -z "$APK" ] && APK=$(find _app/android/app/build/outputs/apk -name "*.apk" | head -1)
          echo "APK: $APK"
          ls -lh "$APK"
          echo "=== Contents ==="
          unzip -l "$APK" | grep -E "myapp|node-libs|ui-dist|assets/index" | head -20

      # ── E2E Emulator ───────────────────────────────────────
      - name: Enable KVM
        run: |
          sudo groupadd -r kvm 2>/dev/null || true
          sudo gpasswd -a $USER kvm 2>/dev/null || true
          sudo chown $USER /dev/kvm 2>/dev/null || sudo chmod 666 /dev/kvm 2>/dev/null || true

      - name: E2E Emulator Test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disk-size: 16384M
          ram-size: 4096M
          heap-size: 1024M
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -partition-size 16384
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            set -e
            APK=$(find _app/android/app/build/outputs/apk -name "*.apk" -not -name "*unsigned*" | head -1)
            [ -z "$APK" ] && APK=$(find _app/android/app/build/outputs/apk -name "*.apk" | head -1)
            echo "Installing: $APK"
            adb wait-for-device
            adb shell settings put global window_animation_scale 0 || true
            adb shell settings put global transition_animation_scale 0 || true
            adb shell settings put global animator_duration_scale 0 || true
            adb push "$APK" /data/local/tmp/app.apk
            adb shell pm install -r -d /data/local/tmp/app.apk
            adb shell rm -f /data/local/tmp/app.apk || true
            adb shell am start -n com.paperclip.app/.MainActivity
            adb forward tcp:3100 tcp:3100 || true
            adb forward tcp:8089 tcp:8089 || true
            OK=0
            for i in $(seq 1 45); do
              sleep 3
              PID=$(adb shell pidof com.paperclip.app 2>/dev/null || echo "")
              echo "[Tick $i/45] PID=$PID"
              RESP=$(curl -s --max-time 3 "http://127.0.0.1:8089/" 2>/dev/null || true)
              RESP3100=$(curl -s --max-time 3 "http://127.0.0.1:3100/api/health" 2>/dev/null || true)
              if [ -n "$RESP" ] || [ -n "$RESP3100" ]; then echo "✓ Server UP!"; OK=1; fi
              if [ "$OK" = "1" ]; then sleep 3; break; fi
            done
            adb logcat -d -s PaperclipMain:I PaperclipKA:I NodeRunner:I RouterService:I AndroidRuntime:E 2>/dev/null | tail -50 || true
            echo "=== E2E RESULT ==="
            if [ "$OK" = "1" ]; then echo "✅ PASS"; else echo "⚠️ WARN: server not responding"; fi

      # ── Upload + Release ────────────────────────────────────
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Paperclip-${{ inputs.build_type || 'release' }}-apk-SEA
          path: _app/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create Release
        if: inputs.build_type == 'release' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: paperclip-apk-${{ github.run_number }}
          name: Paperclip APK SEA #${{ github.run_number }}
          files: _app/android/app/build/outputs/apk/**/*.apk
          draft: false
          prerelease: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
