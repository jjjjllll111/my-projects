# Build Paperclip Android APK
# Source code: jjjjllll111/paperclip-app (forked from PocketDeploy, cleaned)
# Each run: checkout paperclip-app → Gradle build APK → E2E test → Upload
name: Build Paperclip APK

on:
  workflow_dispatch:
    inputs:
      paperclip_app_ref:
        description: "paperclip-app branch/ref"
        required: false
        default: master
      paperclip_master_ref:
        description: "paperclip-master branch/ref (for UI assets)"
        required: false
        default: master
      build_type:
        description: "debug or release"
        required: false
        default: release
  push:
    branches: [main]
    paths: [".github/workflows/paperclip-app.yml"]

permissions: { contents: read }
concurrency:
  group: paperclip-apk-${{ inputs.paperclip_app_ref || 'main' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"
    steps:
      # ── Checkout source ──────────────────────────────────────
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - name: Checkout paperclip-app (Android project)
        uses: actions/checkout@v4
        with:
          repository: jjjjllll111/paperclip-app
          ref: ${{ inputs.paperclip_app_ref || 'master' }}
          token: ${{ secrets.GH_PAT }}
          path: _app
          fetch-depth: 1

      - name: Checkout paperclip-master (latest code)
        uses: actions/checkout@v4
        with:
          repository: jjjjllll111/paperclip-master
          ref: ${{ inputs.paperclip_master_ref || 'master' }}
          token: ${{ secrets.GH_PAT }}
          path: _paperclip
          fetch-depth: 1

      # ── Setup tools ─────────────────────────────────────────
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - run: corepack enable || true

      - uses: pnpm/action-setup@v4
        with: { version: 9, run_install: false }

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }

      - uses: android-actions/setup-android@v3

      - run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      # ── Build Paperclip UI (Vite) ───────────────────────────
      - name: Build Paperclip UI
        working-directory: _paperclip
        run: |
          pnpm install --no-frozen-lockfile
          cd ui && pnpm build
          find dist -name "*.map" -delete 2>/dev/null || true
          find dist -name "*.LICENSE" -delete 2>/dev/null || true
          echo "UI: $(du -sh dist | cut -f1) files=$(find dist -type f | wc -l)"

      # ── Copy UI assets into Android project ─────────────────
      - name: Copy UI assets to Android
        run: |
          set -euo pipefail
          ASSETS=_app/android/app/src/main/assets/ui-dist
          rm -rf "$ASSETS"
          mkdir -p "$ASSETS"
          cp -a _paperclip/ui/dist/. "$ASSETS/"
          echo "Assets: $(du -sh "$ASSETS" | cut -f1) files=$(find "$ASSETS" -type f | wc -l)"

      # ── Build APK (Gradle) ─────────────────────────────────
      - name: Build APK
        working-directory: _app/android
        run: |
          set -euo pipefail
          chmod +x gradlew 2>/dev/null || true
          # Download Gradle directly if wrapper fails
          if ! ./gradlew --version 2>/dev/null; then
            echo "Gradle wrapper failed, downloading Gradle 8.6..."
            curl -fsSL -o /tmp/gradle.zip "https://services.gradle.org/distributions/gradle-8.6-bin.zip"
            cd /tmp && unzip -qo gradle.zip
            export PATH=/tmp/gradle-8.6/bin:$PATH
          fi
          gradle --version | head -3
          if [ "${{ inputs.build_type }}" = "debug" ]; then
            gradle :app:assembleDebug --stacktrace --no-daemon
          else
            gradle :app:assembleRelease --stacktrace --no-daemon
            KEYSTORE="$RUNNER_TEMP/paperclip.keystore"
            keytool -genkeypair -v -keystore "$KEYSTORE" -alias paperclip -keyalg RSA -keysize 2048 -validity 10000 -storepass paperclip -keypass paperclip -dname "CN=Paperclip,OU=CI,O=Paperclip,L=Local,ST=Local,C=CN"
            UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
            SIGNED="app/build/outputs/apk/release/app-release-signed.apk"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$KEYSTORE" --ks-pass pass:paperclip --key-pass pass:paperclip --out "$SIGNED" "$UNSIGNED"
            cp "$SIGNED" "app/build/outputs/apk/release/app-release.apk"
          fi
          echo "=== APK ==="
          find app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;

      - name: Verify APK
        run: |
          APK=$(find _app/android/app/build/outputs/apk -name "*.apk" -not -name "*unsigned*" | head -1)
          [ -z "$APK" ] && APK=$(find _app/android/app/build/outputs/apk -name "*.apk" | head -1)
          echo "APK: $APK"
          ls -lh "$APK"
          unzip -l "$APK" | grep -E "assets/ui-dist|assets/index.html|classes|lib/" | head -20
          echo "DEX: $(unzip -l "$APK" | grep -c 'classes.*\.dex')"

      # ── E2E Emulator ───────────────────────────────────────
      - name: Enable KVM
        run: |
          sudo groupadd -r kvm 2>/dev/null || true
          sudo gpasswd -a $USER kvm 2>/dev/null || true
          sudo chown $USER /dev/kvm 2>/dev/null || sudo chmod 666 /dev/kvm 2>/dev/null || true
          ls -la /dev/kvm || true

      - name: E2E Emulator Test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disk-size: 16384M
          ram-size: 4096M
          heap-size: 1024M
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -partition-size 16384
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            set -e
            APK=$(find _app/android/app/build/outputs/apk -name "*.apk" -not -name "*unsigned*" | head -1)
            [ -z "$APK" ] && APK=$(find _app/android/app/build/outputs/apk -name "*.apk" | head -1)
            echo "Installing: $APK"
            adb wait-for-device
            adb shell settings put global window_animation_scale 0 || true
            adb shell settings put global transition_animation_scale 0 || true
            adb shell settings put global animator_duration_scale 0 || true
            adb push "$APK" /data/local/tmp/app.apk
            adb shell pm install -r -d /data/local/tmp/app.apk
            adb shell rm -f /data/local/tmp/app.apk || true
            adb shell am start -n com.paperclip.app/.MainActivity
            adb forward tcp:8089 tcp:8089 || true
            adb forward tcp:20128 tcp:20128 || true
            OK=0
            for i in $(seq 1 45); do
              sleep 3
              PID=$(adb shell pidof com.paperclip.app 2>/dev/null || echo "")
              echo "[Tick $i/45] PID=$PID"
              RESP=$(curl -s --max-time 3 "http://127.0.0.1:8089/api/status" 2>/dev/null || curl -s --max-time 3 "http://127.0.0.1:8089/" 2>/dev/null || true)
              if [ -n "$RESP" ]; then echo "✓ LAN server UP!"; OK=1; fi
              if [ "$OK" = "1" ]; then sleep 3; break; fi
            done
            adb logcat -d -s PaperclipMain:I PaperclipKA:I NodeRunner:I RouterService:I AndroidRuntime:E 2>/dev/null | tail -50 || true
            echo "=== E2E RESULT ==="
            if [ "$OK" = "1" ]; then echo "✅ PASS"; else echo "⚠️ WARN: LAN server not responding"; fi

      # ── Upload + Release ────────────────────────────────────
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Paperclip-${{ inputs.build_type || 'release' }}-apk
          path: _app/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create Release
        if: inputs.build_type == 'release' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: paperclip-apk-${{ github.run_number }}
          name: Paperclip APK #${{ github.run_number }}
          files: _app/android/app/build/outputs/apk/**/*.apk
          draft: false
          prerelease: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
