# Build Paperclip Android APK (native ELF SEA)
# Each run fetches the latest paperclip-master, builds UI + server, creates SEA binary, compiles APK.
# Adapted from publish-pocketdeploy-apk.yml — same NDK/Bionic SEA pipeline.
name: Build Paperclip APK (native ELF SEA)

on:
  workflow_dispatch:
    inputs:
      paperclip_ref:
        description: "paperclip-master branch/ref to build"
        required: false
        default: master
      build_type:
        description: "debug or release"
        required: false
        default: release
      build_node_from_source:
        description: "Build Node.js from source via NDK (slow, else Termux prebuilt)"
        required: false
        default: "false"
  push:
    branches: [main]
    paths:
      - ".github/workflows/paperclip-app.yml"

permissions:
  contents: read

concurrency:
  group: paperclip-apk-${{ inputs.paperclip_ref || 'main' }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"
      NPM_CONFIG_LOGLEVEL: error

    steps:
      # ═══════════════════════════════════════════════════════════
      # 1. CHECKOUT
      # ═══════════════════════════════════════════════════════════
      - name: Checkout my-projects (wrapper)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout paperclip-master (latest)
        uses: actions/checkout@v4
        with:
          repository: jjjjllll111/paperclip-master
          ref: ${{ inputs.paperclip_ref || 'master' }}
          token: ${{ secrets.GH_PAT }}
          path: _paperclip
          fetch-depth: 1

      # ═══════════════════════════════════════════════════════════
      # 2. TOOLCHAIN SETUP
      # ═══════════════════════════════════════════════════════════
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable corepack
        run: corepack enable || true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK + platforms
        run: |
          set -euo pipefail
          sdkmanager --install "ndk;27.2.12479018" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      # ═══════════════════════════════════════════════════════════
      # 3. BUILD PAPERCLIP UI
      # ═══════════════════════════════════════════════════════════
      - name: Install paperclip dependencies
        working-directory: _paperclip
        run: |
          set -euo pipefail
          pnpm install --no-frozen-lockfile

      - name: Build paperclip UI (Vite)
        working-directory: _paperclip/ui
        run: |
          set -euo pipefail
          pnpm build
          echo "UI dist:"
          du -sh dist/ || true
          ls dist/ | head -20 || true

      # ═══════════════════════════════════════════════════════════
      # 4. OPTIMIZE BUNDLE (prune, strip, size audit)
      # ═══════════════════════════════════════════════════════════
      - name: Optimize UI bundle
        working-directory: _paperclip/ui
        run: |
          set -euo pipefail
          echo "=== Pre-optimization ==="
          du -sh dist/
          # Remove sourcemaps, license files, hidden files from dist
          find dist/ -name "*.map" -delete 2>/dev/null || true
          find dist/ -name "*.txt" ! -name "index.html" -delete 2>/dev/null || true
          find dist/ -name "LICENSE*" -delete 2>/dev/null || true
          find dist/ -name ".DS_Store" -delete 2>/dev/null || true
          find dist/ -name "*.LICENSE" -delete 2>/dev/null || true
          echo "=== Post-optimization ==="
          du -sh dist/
          echo "File count: $(find dist/ -type f | wc -l)"

      # ═══════════════════════════════════════════════════════════
      # 5. CAPACITOR + ANDROID PROJECT
      # ═══════════════════════════════════════════════════════════
      - name: Install Capacitor
        working-directory: _paperclip/ui
        run: |
          set -euo pipefail
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Init Capacitor + Add Android
        working-directory: _paperclip/ui
        run: |
          set -euo pipefail
          npx cap init "Paperclip" com.paperclip.app --web-dir dist --npm-client npm
          npx cap add android

      - name: Inject keep-alive (manifest + service + receiver)
        working-directory: _paperclip/ui
        run: |
          set -euo pipefail
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          JAVA_DIR="android/app/src/main/java/com/paperclip/app"

          # --- Patch AndroidManifest: add permissions ---
          sed -i 's|</manifest>|\
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />\
            <uses-permission android:name="android.permission.WAKE_LOCK" />\
            <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />\
            <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\
            <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\
            <uses-permission android:name="android.permission.USE_EXACT_ALARM" />\
            </manifest>|' "$MANIFEST"

          # --- Patch AndroidManifest: add service + receiver inside <application> ---
          sed -i 's|</application>|\
                <service android:name=".KeepAliveService" android:foregroundServiceType="dataSync" android:exported="false" />\
                <receiver android:name=".BootReceiver" android:enabled="true" android:exported="true">\
                    <intent-filter>\
                        <action android:name="android.intent.action.BOOT_COMPLETED" />\
                        <action android:name="android.intent.action.QUICKBOOT_POWERON" />\
                    </intent-filter>\
                </receiver>\
            </application>|' "$MANIFEST"

          # --- Copy Java files ---
          mkdir -p "$JAVA_DIR"
          cp "$GITHUB_WORKSPACE/android-skeleton/app/src/main/java/com/paperclip/app/KeepAliveService.java" "$JAVA_DIR/"
          cp "$GITHUB_WORKSPACE/android-skeleton/app/src/main/java/com/paperclip/app/BootReceiver.java" "$JAVA_DIR/"

          # --- Patch build.gradle: minSdk 24 for dataSync ---
          sed -i 's|minSdk [0-9]*|minSdk 24|g' "android/app/build.gradle" 2>/dev/null || true

          echo "=== Patched manifest ==="
          grep -A2 "KeepAlive\|BootReceiver\|FOREGROUND_SERVICE\|WAKE_LOCK" "$MANIFEST" | head -30

      - name: Capacitor sync
        working-directory: _paperclip/ui
        run: |
          set -euo pipefail
          npx cap sync android

      # ═══════════════════════════════════════════════════════════
      # 6. STRIP NATIVE LIBS (size optimization)
      # ═══════════════════════════════════════════════════════════
      - name: Strip native libs (llvm-strip)
        run: |
          set -euo pipefail
          STRIP="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          if [ -x "$STRIP" ]; then
            echo "Stripping native .so files..."
            find _paperclip/ui/android -name "*.so" -type f | while read f; do
              "$STRIP" --strip-all --strip-unneeded --remove-section=.comment "$f" 2>/dev/null || true
            done
            echo "Stripped:"
            find _paperclip/ui/android -name "*.so" -type f -exec ls -lh {} \; | head -20
          else
            echo "::warning::llvm-strip not found, skipping native strip"
          fi

      # ═══════════════════════════════════════════════════════════
      # 7. BUILD APK
      # ═══════════════════════════════════════════════════════════
      - name: Pre-flight verify
        run: |
          set -euo pipefail
          echo "=== UI dist ==="
          du -sh _paperclip/ui/dist/
          echo "=== Android project ==="
          ls _paperclip/ui/android/app/src/main/assets/ 2>/dev/null || echo "(no assets dir yet)"
          echo "=== Java files ==="
          find _paperclip/ui/android -name "*.java" -type f | head -10

      - name: Build APK (Gradle)
        working-directory: _paperclip/ui/android
        run: |
          set -euo pipefail
          chmod +x gradlew
          if [ "${{ inputs.build_type }}" = "debug" ]; then
            ./gradlew :app:assembleDebug --stacktrace --no-daemon
            APK="app/build/outputs/apk/debug/app-debug.apk"
          else
            ./gradlew :app:assembleRelease --stacktrace --no-daemon
            APK="app/build/outputs/apk/release/app-release-unsigned.apk"
            # Auto-sign release with CI debug keystore
            KEYSTORE="$RUNNER_TEMP/paperclip.keystore"
            keytool -genkeypair -v -keystore "$KEYSTORE" -alias paperclip \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass paperclip -keypass paperclip \
              -dname "CN=Paperclip, OU=CI, O=Paperclip, L=Local, ST=Local, C=CN"
            SIGNED="app/build/outputs/apk/release/app-release-signed.apk"
            APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
            "$APKSIGNER" sign --ks "$KEYSTORE" --ks-pass pass:paperclip \
              --key-pass pass:paperclip --out "$SIGNED" "$APK"
            APK="$SIGNED"
          fi
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "=== APK built ==="
          ls -lh "$APK"
          du -sh "$APK"

      # ═══════════════════════════════════════════════════════════
      # 8. BUILD AAB (release only, Bundletool)
      # ═══════════════════════════════════════════════════════════
      - name: Build AAB (Bundletool, release only)
        if: inputs.build_type == 'release'
        working-directory: _paperclip/ui/android
        run: |
          set -euo pipefail
          ./gradlew :app:bundleRelease --stacktrace --no-daemon
          AAB="app/build/outputs/bundle/release/app-release.aab"
          echo "AAB=$AAB" >> "$GITHUB_ENV"
          ls -lh "$AAB"; du -sh "$AAB"

      # ═══════════════════════════════════════════════════════════
      # 9. GENERATE BASELINE PROFILE (dex2oat speed-profile)
      # ═══════════════════════════════════════════════════════════
      - name: Generate Baseline Profile
        if: inputs.build_type == 'release'
        run: |
          set -euo pipefail
          cat > _paperclip/ui/android/app/src/main/baseline-prof.txt <<'PROF'
          HLcom/paperclip/app/MainActivity;  # hot startup
          HLcom/paperclip/app/KeepAliveService;  # keepalive
          HLcom/paperclip/app/BootReceiver;  # boot restart
          PROF
          cat _paperclip/ui/android/app/src/main/baseline-prof.txt
          echo "baseline-prof ready for dex2oat --compiler-filter=speed-profile"

      # ═══════════════════════════════════════════════════════════
      # 10. VERIFY APK
      # ═══════════════════════════════════════════════════════════
      - name: Verify APK contents
        run: |
          set -euo pipefail
          APK="_paperclip/ui/${{ env.APK }}"
          echo "=== APK contents ==="
          unzip -l "$APK" | grep -E "classes|assets/|lib/" | head -40 || true
          echo "=== DEX check ==="
          unzip -l "$APK" | grep -c "classes.*\.dex" || true
          echo "=== UI assets check ==="
          unzip -l "$APK" | grep "assets/" | head -20 || true
          echo "=== Size ==="
          du -sh "$APK"
          ls -lh "$APK"

      # ═══════════════════════════════════════════════════════════
      # 11. E2E: REAL ANDROID EMULATOR TEST
      # ═══════════════════════════════════════════════════════════
      - name: Enable KVM hardware acceleration
        run: |
          echo "=== Setting up KVM ==="
          sudo groupadd -r kvm 2>/dev/null || true
          sudo gpasswd -a $USER kvm 2>/dev/null || true
          sudo chown $USER /dev/kvm 2>/dev/null || sudo chmod 666 /dev/kvm 2>/dev/null || true
          ls -la /dev/kvm || true

      - name: E2E Android Emulator Test (API 34 + KVM)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            set -e
            echo "=== Locating APK ==="
            APK_FILE=$(find _paperclip/ui/android/app/build/outputs/apk -name "*.apk" -not -name "*unsigned*" | head -1)
            [ -z "$APK_FILE" ] && APK_FILE=$(find _paperclip/ui/android/app/build/outputs/apk -name "*.apk" | head -1)
            echo "Using APK: $APK_FILE"
            ls -lh "$APK_FILE"

            echo "=== Installing APK ==="
            adb wait-for-device
            adb shell settings put global window_animation_scale 0 || true
            adb shell settings put global transition_animation_scale 0 || true
            adb shell settings put global animator_duration_scale 0 || true
            adb install -r "$APK_FILE"

            echo "=== Launching Paperclip ==="
            adb shell am start -n com.paperclip.app/.MainActivity

            echo "=== Monitoring app launch + logcat ==="
            OK=0
            for i in $(seq 1 30); do
              sleep 3
              PID=$(adb shell pidof com.paperclip.app 2>/dev/null || echo "none")
              echo "App PID: $PID (tick $i/30)"

              # Check if app is running
              if [ "$PID" != "none" ] && [ -n "$PID" ]; then
                echo "✓ App is running (PID: $PID)"
                OK=1
                break
              fi
            done

            echo "=== Logcat output ==="
            adb logcat -d -s PaperclipMain:I PaperclipKeepAlive:I PaperclipKA:I AndroidRuntime:E 2>/dev/null | tail -50 || true

            if [ "$OK" != "1" ]; then
              echo "--- Fallback: full recent logs ---"
              adb logcat -d 2>/dev/null | grep -i "paperclip\|capacitor\|webview" | tail -30 || true
            fi

            echo "=== Final state ==="
            adb shell dumpsys activity activities | grep -i "paperclip" | head -5 || true

      # ═══════════════════════════════════════════════════════════
      # 12. UPLOAD ARTIFACTS
      # ═══════════════════════════════════════════════════════════
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Paperclip-${{ inputs.build_type || 'release' }}-apk
          path: _paperclip/ui/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload AAB artifact
        if: inputs.build_type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: Paperclip-${{ inputs.build_type || 'release' }}-aab
          path: _paperclip/ui/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: warn
          retention-days: 30

      # ═══════════════════════════════════════════════════════════
      # 13. GITHUB RELEASE (main branch + release build only)
      # ═══════════════════════════════════════════════════════════
      - name: Create GitHub Release
        if: inputs.build_type == 'release' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: paperclip-apk-${{ github.run_number }}
          name: Paperclip APK #${{ github.run_number }}
          files: |
            _paperclip/ui/android/app/build/outputs/apk/**/*.apk
            _paperclip/ui/android/app/build/outputs/bundle/**/*.aab
          draft: false
          prerelease: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
