# Optimized variant of publish-9router.yml.
#
# Differences vs v1 (all optimizations are packaging/CI-level — the shipped
# engine dependency closure and pre-baked models are preserved 1:1):
#
#   CI speed
#     - fetch-depth: 1 (no history needed for a release build)
#     - npm cache via actions/setup-node (keyed on the root package-lock.json)
#     - deterministic `npm ci` with `npm install` fallback; optional opt-in
#       `npm dedupe` (default OFF — kept off so the module graph matches v1)
#     - telemetry off, quiet npm, prefer-offline
#
#   Artifact size / startup / file-I/O
#     - prune dev-only junk from cli/app/node_modules ONLY:
#       test/tests/__tests__/__mocks__/coverage/docs/examples/benchmarks/.github/
#       .git/.cache dirs; *.md, *.d.ts, *.tsbuildinfo, lint configs, logs
#     - strip *.map source maps everywhere under cli/app
#       (pairing-aware OUTSIDE node_modules so a rare data `.map` survives;
#        cli/app/engine-models/** model weights are NEVER touched)
#     - remove now-empty directories (fewer stat() calls during module load)
#     - esbuild transform-minify of the raw bootstrap files custom-server.js /
#       server.js (transform only — no bundling, dynamic requires untouched)
#     - parallel gzip (pigz) archive step
#
#   Integrity guardrails (fail the build instead of shipping a broken artifact)
#     - bundle-engine-deps.mjs still runs with --strict (missing entry pkg = fail)
#     - preload-engine-models.mjs still bakes tinybert + bert-base weights
#     - import smoke test over the exact 8 runtime specifiers used by
#       open-sse/services/compression/optionalDeps.js — run BEFORE pruning as a
#       baseline and AFTER pruning; any spec regressing pass->fail aborts.
#       (Without this, fail-open engines would silently degrade AND trigger a
#        surprise background `npm install` on end-user machines.)
#
#   NOTE on esbuild/Rolldown/SWC: Next already compiles with native SWC on the
#   runner and the MITM server is esbuild-bundled by buildMitm.js. Single-file
#   bundling of engine packages was evaluated and REJECTED: runtime imports use
#   subpaths (js-tiktoken/lite, js-tiktoken/ranks/o200k_base,
#   omniglyph/applicability) which single-file bundles would break.

name: Build 9router CLI (Optimized) and Upload to Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to build from 9router-private
        required: true
        default: master
      release_tag:
        description: Release tag to upload to (separate channel from v1's cli-latest)
        required: true
        default: cli-latest-opt
      npm_dedupe:
        description: Opt-in npm dedupe before build (changes module graph; smoke-tested)
        required: false
        default: "false"

permissions:
  contents: read

concurrency:
  group: publish-9route-2-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NODE_OPTIONS: --max-old-space-size=12288
      NEXT_TELEMETRY_DISABLED: "1"
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"
      NPM_CONFIG_LOGLEVEL: error
      NPM_CONFIG_PREFER_OFFLINE: "true"
    steps:
      - name: Checkout 9router from private repository
        uses: actions/checkout@v4
        with:
          repository: jjjjllll111/9router-private
          ref: ${{ inputs.ref || 'master' }}
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          if [ "${{ inputs.npm_dedupe }}" = "true" ]; then
            echo "::notice::Running opt-in npm dedupe"
            npm dedupe
          fi

      - name: Install CLI dependencies
        run: |
          cd cli
          npm install --no-audit --no-fund

      - name: Build CLI
        run: |
          cd cli
          npm run build
          echo "✓ CLI build completed"

      # ---- UNCHANGED from v1: full dependency closure + baked model weights ----
      - name: Bundle engine deps and models into cli/app
        run: |
          set -euo pipefail
          node scripts/bundle-engine-deps.mjs cli/app-engine-deps --strict
          node scripts/preload-engine-models.mjs cli/app-engine-models
          if [ -d "cli/app-engine-deps/node_modules" ]; then
            mkdir -p cli/app/node_modules
            cp -r cli/app-engine-deps/node_modules/. cli/app/node_modules/
          fi
          if [ -d "cli/app-engine-models" ]; then
            mkdir -p cli/app/engine-models
            cp -r cli/app-engine-models/. cli/app/engine-models/
          fi
          echo "cli/app after bundle: $(du -sh cli/app | cut -f1)"
          du -sh cli/app/node_modules cli/app/engine-models 2>/dev/null || true

      # ---- NEW in v2: integrity baseline + prune + minify + re-verify ----
      - name: Optimize artifact (prune dev-junk, strip source maps, minify bootstrap)
        run: |
          cat > "$RUNNER_TEMP/optimize-bundle.mjs" <<'OPT_EOF'
          #!/usr/bin/env node
          /**
           * publish-9route-2 artifact optimizer.
           *
           * Scope guardrails:
           *   - Touches ONLY third-party trees: cli/app/node_modules/** plus
           *     pairing-checked *.map elsewhere under cli/app.
           *   - NEVER touches cli/app/engine-models/** (baked model weights).
           *   - NEVER deletes whole dependency packages — junk categories only.
           *   - Verifies the exact 8 runtime engine specifiers BEFORE pruning
           *     (baseline) and AFTER; pass->fail regression aborts (exit 3).
           */
          import fs from "node:fs";
          import path from "node:path";
          import { execFileSync } from "node:child_process";
          import { createRequire } from "node:module";

          const APP = path.resolve(process.argv[2] || "cli/app");
          const NM = path.join(APP, "node_modules");
          const MODELS = path.join(APP, "engine-models");
          const MINIFY_BOOTSTRAP = process.env.OPT_MINIFY_BOOTSTRAP !== "0";

          /** Exact specifiers open-sse/services/compression resolves at runtime. */
          const ENGINE_SPECS = [
            "omniglyph",
            "omniglyph/applicability",
            "@huggingface/transformers",
            "@atjsh/llmlingua-2",
            "js-tiktoken/lite",
            "js-tiktoken/ranks/o200k_base",
            "smol-toml",
            "safe-regex",
          ];

          /** Dev-only directory names — deleted wherever they sit inside node_modules. */
          const JUNK_DIRS = new Set([
            "test", "tests", "__tests__", "__mocks__", "__fixtures__",
            "coverage", ".nyc_output", ".github", ".circleci", ".git",
            ".husky", ".vscode", ".idea", ".cache",
            "docs", "doc", "example", "examples", "samples",
            "benchmark", "benchmarks",
          ]);

          function fmtMiB(n) { return (n / 1024 / 1024).toFixed(1) + " MiB"; }

          function walkStats(root) {
            let files = 0, bytes = 0;
            const stack = [root];
            while (stack.length) {
              const dir = stack.pop();
              let entries;
              try { entries = fs.readdirSync(dir, { withFileTypes: true }); } catch { continue; }
              for (const entry of entries) {
                const p = path.join(dir, entry.name);
                if (entry.isDirectory()) stack.push(p);
                else { files++; try { bytes += fs.statSync(p).size; } catch { /* unreadable */ } }
              }
            }
            return { files, bytes };
          }

          /** Dynamic-import one bare specifier with cwd=APP (real resolution chain). */
          function smokeSpec(spec) {
            try {
              execFileSync(
                process.execPath,
                ["--no-warnings", "-e",
                 "Promise.resolve().then(function(){return import(process.argv[1])})" +
                 ".then(function(){process.exit(0)}," +
                 "function(e){console.error(String((e&&e.message)||e));process.exit(1)})",
                 spec],
                { cwd: APP, stdio: ["ignore", "pipe", "pipe"], timeout: 90000 },
              );
              return true;
            } catch { return false; }
          }

          function smokeAll() {
            const out = {};
            for (const spec of ENGINE_SPECS) out[spec] = smokeSpec(spec);
            return out;
          }

          function junkFileKind(name) {
            const lower = name.toLowerCase();
            if (lower.endsWith(".map")) return "sourcemap";
            if (lower.endsWith(".d.ts") || lower.endsWith(".d.mts") || lower.endsWith(".d.cts")) return "typedef";
            if (lower.endsWith(".md") || lower.endsWith(".markdown")) return "docs";
            if (
              lower.endsWith(".tsbuildinfo") || lower.endsWith(".log") ||
              lower.endsWith(".tgz") || lower.endsWith(".orig") || lower.endsWith(".rej")
            ) return "misc";
            if (
              name === ".DS_Store" || name === "Thumbs.db" || name === ".npmignore" ||
              name === ".eslintignore" || name === ".babelrc" || name === ".babelrc.js" ||
              name === ".babelrc.cjs" || lower.startsWith(".eslintrc") ||
              lower.startsWith(".prettierrc") || lower.startsWith(".mocharc") ||
              lower.startsWith(".travis") || lower.startsWith(".appveyor") ||
              lower.startsWith(".coveralls")
            ) return "config";
            return null;
          }

          const deleted = {};
          function count(kind) {
            if (!deleted[kind]) deleted[kind] = { count: 0, bytes: 0 };
            return deleted[kind];
          }
          function rmPath(kind, p) {
            let bytes = 0;
            try { bytes = fs.statSync(p).size ?? 0; } catch { /* gone already */ }
            fs.rmSync(p, { recursive: true, force: true });
            const bucket = count(kind);
            bucket.count += 1;
            bucket.bytes += bytes;
          }

          /** True when a .map has no sibling code file => treat as DATA, keep it. */
          function isDataMap(dir, name) {
            const base = name.slice(0, -4);
            let siblings;
            try { siblings = fs.readdirSync(dir); } catch { return false; }
            return !(
              siblings.includes(base + ".js") ||
              siblings.includes(base + ".mjs") ||
              siblings.includes(base + ".cjs")
            );
          }

          /** Pass 1: junk files/dirs inside node_modules (any depth). All .map go. */
          function pruneNodeModules() {
            const stack = [NM];
            while (stack.length) {
              const dir = stack.pop();
              let entries;
              try { entries = fs.readdirSync(dir, { withFileTypes: true }); } catch { continue; }
              for (const entry of entries) {
                const p = path.join(dir, entry.name);
                if (entry.isDirectory()) {
                  if (JUNK_DIRS.has(entry.name)) { rmPath("junkdir", p); continue; }
                  stack.push(p);
                  continue;
                }
                const kind = junkFileKind(entry.name);
                // Inside node_modules every .map is treated as a sourcemap
                // (same policy as node-prune/docker slim images).
                if (kind) rmPath(kind, p);
              }
            }
          }

          /** Pass 2: outside node_modules — pairing-checked .map only, skip MODELS. */
          function sweepAppMaps() {
            const stack = [APP];
            while (stack.length) {
              const dir = stack.pop();
              if (dir === NM) continue; // handled by pruneNodeModules()
              if (dir === MODELS || dir.startsWith(MODELS + path.sep)) continue; // never touch weights
              let entries;
              try { entries = fs.readdirSync(dir, { withFileTypes: true }); } catch { continue; }
              for (const entry of entries) {
                const p = path.join(dir, entry.name);
                if (entry.isDirectory()) { stack.push(p); continue; }
                const lower = entry.name.toLowerCase();
                if (lower.endsWith(".map")) {
                  if (!isDataMap(dir, entry.name)) rmPath("sourcemap", p);
                } else if (entry.name === ".DS_Store" || entry.name === "Thumbs.db") {
                  rmPath("misc", p);
                }
              }
            }
          }

          /** Bottom-up removal of directories left empty by the passes above. */
          function sweepEmptyDirs(root) {
            const order = [];
            const stack = [root];
            while (stack.length) {
              const dir = stack.pop();
              order.push(dir);
              let entries;
              try { entries = fs.readdirSync(dir, { withFileTypes: true }); } catch { continue; }
              for (const entry of entries) {
                if (entry.isDirectory()) stack.push(path.join(dir, entry.name));
              }
            }
            let removed = 0;
            for (const dir of order.reverse()) {
              try {
                if (fs.readdirSync(dir).length === 0) { fs.rmdirSync(dir); removed++; }
              } catch { /* raced or non-empty */ }
            }
            return removed;
          }

          /** Transform-only minify: same module structure, dynamic requires intact. */
          function minifyBootstraps() {
            if (!MINIFY_BOOTSTRAP) return { files: 0, saved: 0 };
            const requireFromCli = createRequire(path.resolve("cli/package.json"));
            const esbuild = requireFromCli("esbuild");
            let files = 0, saved = 0;
            for (const name of ["custom-server.js", "server.js"]) {
              const p = path.join(APP, name);
              if (!fs.existsSync(p)) continue;
              const src = fs.readFileSync(p, "utf8");
              const out = esbuild.transformSync(src, { minify: true, platform: "node", target: "node18" });
              if (out.code.length < src.length) {
                fs.writeFileSync(p, out.code);
                files++;
                saved += Buffer.byteLength(src) - Buffer.byteLength(out.code);
              }
            }
            return { files, saved };
          }

          // ---- run -------------------------------------------------------------
          if (!fs.existsSync(NM)) { console.error("optimize-bundle: missing " + NM); process.exit(2); }

          const statsBefore = walkStats(APP);
          const beforeSmoke = smokeAll();

          pruneNodeModules();
          sweepAppMaps();
          const emptyDirsRemoved = sweepEmptyDirs(NM);
          const minified = minifyBootstraps();

          const statsAfter = walkStats(APP);
          const afterSmoke = smokeAll();

          const regressions = ENGINE_SPECS.filter((s) => beforeSmoke[s] && !afterSmoke[s]);
          const lines = [];
          lines.push("| check | result |");
          lines.push("| --- | --- |");
          for (const spec of ENGINE_SPECS) {
            const mark = (ok) => (ok ? "✅" : "❌");
            lines.push(
              "| `" + spec + "` | " +
              mark(beforeSmoke[spec]) + " → " + mark(afterSmoke[spec]) + " |",
            );
          }
          const report = [
            "",
            "== optimize-bundle report ==",
            "files : " + statsBefore.files + " -> " + statsAfter.files +
              " (-" + (statsBefore.files - statsAfter.files) + ")",
            "bytes : " + fmtMiB(statsBefore.bytes) + " -> " + fmtMiB(statsAfter.bytes) +
              " (-" + fmtMiB(Math.max(0, statsBefore.bytes - statsAfter.bytes)) + ")",
            ...Object.entries(deleted).map(
              ([kind, v]) => "  " + kind.padEnd(9) + ": " + v.count + " removed (" + fmtMiB(v.bytes) + ")",
            ),
            "empty dirs removed: " + emptyDirsRemoved,
            "bootstrap minified: " + minified.files + " files, " + fmtMiB(minified.saved) + " saved",
            "",
            ...lines,
          ].join("\n");
          console.log(report);

          if (process.env.GITHUB_STEP_SUMMARY) {
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, report + "\n");
          }

          if (regressions.length > 0) {
            console.error("optimize-bundle: engine imports BROKEN by pruning: " + regressions.join(", "));
            process.exit(3);
          }
          OPT_EOF
          node "$RUNNER_TEMP/optimize-bundle.mjs" cli/app

      - name: Verify build output
        run: |
          set -euo pipefail
          if [ ! -d "cli/app" ]; then
            echo "ERROR: cli/app/ directory not created"
            exit 1
          fi
          echo "✓ Build verification successful"
          echo "cli/app/ size: $(du -sh cli/app/ | cut -f1)"
          echo "file count    : $(find cli/app -type f | wc -l)"
          ls -la cli/app/ | head -15

      - name: Create distribution archive (parallel gzip)
        run: |
          set -euo pipefail
          cd cli
          FILES=""
          for f in app cli.js hooks src README.md LICENSE; do
            [ -e "$f" ] && FILES="$FILES $f"
          done
          echo "Packing:$FILES"
          if command -v pigz >/dev/null 2>&1; then
            tar -cf - $FILES | pigz -9 > ../9router-cli.tar.gz
          else
            tar -cf - $FILES | gzip -9 > ../9router-cli.tar.gz
          fi
          cd ..
          ARCHIVE_SIZE=$(du -h 9router-cli.tar.gz | cut -f1)
          echo "✓ Archive created: 9router-cli.tar.gz (${ARCHIVE_SIZE})"

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          TAG=${{ inputs.release_tag || 'cli-latest-opt' }}
          REPO=jjjjllll111/9router-private

          # Create or verify release exists
          gh release view $TAG --repo $REPO || \
            gh release create $TAG --repo $REPO \
              --title "9Router CLI Latest (Optimized)" \
              --notes "Auto-build from ${{ inputs.ref || 'master' }} branch — optimized packaging: pruned dev-junk/source-maps, minified bootstraps, identical engine deps + baked models."

          # Upload and overwrite existing archive
          gh release upload $TAG 9router-cli.tar.gz --repo $REPO --clobber

          echo "✓ Release updated successfully at https://github.com/$REPO/releases/tag/$TAG"
